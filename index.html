<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base de datos Haras Santa María</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --wash:#F7F6F4;
  --ink:#111111;
  --ink-2:#6C6862;
  --naranja:#EA5B0C;
  --naranja-soft:#FDEDE3;
  --linea:#E3E0DB;
  --linea-fuerte:#111111;
  --verde:#2E7D46;
  --ambar:#C98A00;
  --rojo:#C0392B;
  --amarilla:#F2C230;
  --r:8px;
  --display:'Barlow Condensed',system-ui,sans-serif;
  --body:'Work Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}

/* ---- encabezado tipo planilla ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:54px}
.crest{width:26px;height:26px;flex:0 0 26px;border:2px solid var(--ink);border-radius:50%;position:relative}
.crest::after{content:"";position:absolute;inset:4px;background:var(--naranja);border-radius:50%}
.mark{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.mark small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-2);font-weight:400;margin-top:3px}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--naranja);text-decoration:underline;cursor:pointer}
.puerta{max-width:420px;margin:0 auto;padding:8px 0 40px}
.puerta .opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--linea);
  border-radius:var(--r);padding:18px 16px;margin-bottom:12px;cursor:pointer}
.puerta .opt:hover{border-color:var(--naranja)}
.puerta .opt strong{display:block;font-family:var(--display);font-size:22px;letter-spacing:.01em}
.puerta .opt span{display:block;font-size:13px;color:var(--ink-2);margin-top:3px}
.rolebox{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-2);text-align:right;max-width:130px;line-height:1.3}

h2.screen-title{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:.04em;text-transform:uppercase;margin:20px 0 3px}
.screen-note{color:var(--ink-2);font-size:13px;margin:0 0 16px}

/* ---- tabs ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom);display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.05)}
.tabs button{flex:1;padding:13px 4px 15px;color:var(--ink-2);font-family:var(--display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-top:3px solid transparent;margin-top:-1px}
.tabs button[aria-current="true"]{color:var(--ink);border-top-color:var(--naranja)}

/* ---- chips ---- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:99px;border:1px solid var(--linea);color:var(--ink-2);font-family:var(--display);font-size:14px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;white-space:nowrap;background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--naranja);color:#fff;border-color:var(--naranja)}

/* ---- lista ---- */
.roster{border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);padding:12px 13px;border-bottom:1px solid var(--linea)}
.roster .row:last-child{border-bottom:none}
.row:active{background:var(--wash)}
.dorsal{font-family:var(--mono);font-weight:600;font-size:12px;width:34px;height:34px;flex:0 0 34px;border-radius:6px;background:var(--wash);display:grid;place-items:center;color:var(--ink-2)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.score{font-family:var(--mono);font-weight:600;font-size:17px;padding:5px 9px;border-radius:6px;min-width:48px;text-align:center}
.s-alto{background:rgba(46,125,70,.12);color:var(--verde)}
.s-medio{background:rgba(201,138,0,.14);color:var(--ambar)}
.s-bajo{background:rgba(192,57,43,.11);color:var(--rojo)}
.s-vacio{background:var(--wash);color:var(--ink-2)}
.card-mark{display:inline-block;width:7px;height:10px;border-radius:1.5px;vertical-align:-1px;border:.5px solid rgba(0,0,0,.25)}
.card-y{background:var(--amarilla)}
.card-r{background:var(--rojo)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--linea);border-radius:4px;padding:1px 5px;color:var(--ink-2)}

/* ---- ficha ---- */
.back{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:14px;color:var(--ink-2);font-weight:600;padding:14px 0 0}
.ficha-head{border-bottom:2px solid var(--ink);padding-bottom:14px}
.ficha-name{font-family:var(--display);font-size:31px;font-weight:700;line-height:1.05;margin:10px 0 4px;text-transform:uppercase}
.ficha-carnet{font-family:var(--mono);font-size:11px;color:var(--naranja);letter-spacing:.06em;margin-bottom:9px}
.ficha-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);border:1px solid var(--linea);border-radius:4px;padding:3px 7px}
.tag.cat{border-color:var(--ink);color:var(--ink)}
.block{margin:26px 0}
.block-title{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.block-title::after{content:"";flex:1;height:1px;background:var(--ink)}
.block-title span{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-2);letter-spacing:0;text-transform:none}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.stat{padding:11px 12px;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.stat-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-2);text-transform:uppercase}
.stat-value{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:3px}
.stat-value small{font-size:11px;color:var(--ink-2);font-weight:400}

/* tabla comparativa toma a toma */
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--linea);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-weight:500}
.cmp thead th{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid var(--ink);white-space:nowrap}
.cmp td.val{font-family:var(--mono);font-weight:600}
.cmp .dlt{font-family:var(--mono);font-size:11px;display:block;font-weight:500}
.up{color:var(--verde)}.down{color:var(--rojo)}.flat{color:var(--ink-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---- cancha ---- */
.pitch{position:relative;width:100%;aspect-ratio:68/100;background:var(--wash);border:2px solid var(--ink);border-radius:var(--r);overflow:hidden}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:62px;text-align:center}
.slot .bubble{width:42px;height:42px;margin:0 auto;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.slot.lleno .bubble{background:var(--naranja);color:#fff;border-color:var(--naranja)}
.slot .cap{font-family:var(--display);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px;line-height:1.15;color:var(--ink)}
.slot .pos{font-family:var(--mono);font-size:8.5px;color:var(--ink-2)}

/* ---- formularios ---- */
.field{margin-bottom:15px}
.label{display:block;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.label em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:0;text-transform:none;color:var(--ink-2);margin-left:6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--paper);border:1px solid var(--linea);border-radius:var(--r);padding:12px;font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=number]{font-family:var(--mono)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--naranja);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{aspect-ratio:1;border-radius:6px;background:var(--paper);border:1px solid var(--linea);font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.scale button[aria-pressed="true"]{background:var(--naranja);color:#fff;border-color:var(--naranja);font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:var(--r);background:var(--paper);border:1px solid var(--linea);font-size:21px;font-family:var(--mono);line-height:1}
.stepper output{font-family:var(--mono);font-size:21px;font-weight:600;min-width:32px;text-align:center}
.multi{display:flex;flex-wrap:wrap;gap:6px}

.btn{display:block;width:100%;padding:15px;border-radius:var(--r);background:var(--ink);color:#fff;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.btn-naranja{background:var(--naranja)}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.btn-danger{background:var(--paper);color:var(--rojo);border:1px solid var(--rojo)}
.btn:disabled{opacity:.45}
.gap{height:10px}

.empty{border:1px dashed var(--linea);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 15px}
.aviso{background:var(--naranja-soft);border-left:3px solid var(--naranja);padding:11px 13px;border-radius:0 var(--r) var(--r) 0;font-size:13px;margin-bottom:16px}

.pl-tabla{width:100%;border-collapse:collapse}
.pl-tabla th{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em;padding:0 4px 8px;text-align:center;white-space:nowrap}
.pl-tabla th:first-child{text-align:left;padding-left:0}
.pl-tabla td{padding:3px 4px;border-top:1px solid var(--linea);vertical-align:middle}
.pl-tabla td:first-child{padding-left:0;padding-right:12px;font-size:14px;font-weight:600;white-space:nowrap}
.pl-tabla th:first-child,.pl-tabla td:first-child{position:sticky;left:0;z-index:1;
  background:var(--paper);box-shadow:1px 0 0 var(--linea)}
.pl-tabla input[type=number]{width:58px;padding:9px 4px;text-align:center;font-size:15px}
.pl-tabla select{min-width:132px;padding:9px 6px;font-size:12px}
.pl-tabla tr.jugo td:first-child{color:var(--naranja)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:#fff;padding:13px 16px;border-radius:var(--r);font-weight:600;max-width:628px;margin:0 auto;transform:translateY(160%);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease}
.toast.show{transform:translateY(0);opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="crest"></div>
    <div class="mark">Haras Santa María<small>BASE DE DATOS DEPORTIVA</small></div>
    <div class="rolebox" id="rolebox">—</div>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="tabs">
  <button data-tab="plantel" aria-current="true">Plantel</button>
  <button data-tab="cancha">Cancha</button>
  <button data-tab="entrenos">Entrenos</button>
  <button data-tab="cargar">Cargar</button>
  <button data-tab="datos">Datos</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. ALMACENAMIENTO — única capa a reemplazar por Firebase
   ========================================================= */
const KEY = 'hsm:v2';
let memoria = null;
const Store = {
  async load(){
    if (window.storage){ try{ const r = await window.storage.get(KEY,false); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
    try{ const v = localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return memoria; }
  },
  async save(d){
    if (window.storage){ try{ await window.storage.set(KEY, JSON.stringify(d), false); return true; }catch(e){ return false; } }
    try{ localStorage.setItem(KEY, JSON.stringify(d)); return true; }catch(e){ memoria = d; return true; }
  }
};

/* =========================================================
   2. MODELO
   ========================================================= */
const CATEGORIAS = ['Promocional','Cadetes','Juveniles','Juveniles B','Selección','Selección Libre','Primera'];
const POSICIONES = ['Arquero','Lateral Derecho','Central Derecho','Central Izquierdo','Lateral Izquierdo',
  'Mediocampista Defensivo','Mediocampista Interior','Volante Derecho','Volante Izquierdo','Enganche',
  'Extremo Derecho','Extremo Izquierdo','Delantero Centro'];

const FISICO = [
  {id:'cooper', nombre:'Cooper 6 min',   unidad:'m', mejor:'alto'},
  {id:'yoyo',   nombre:'Yo-Yo IR1',      unidad:'m', mejor:'alto'},
  {id:'v30',    nombre:'Velocidad 30 m', unidad:'s', mejor:'bajo', dec:2}
];
const TECNICO = [
  {id:'control',   nombre:'Control y pase'},
  {id:'remate',    nombre:'Remate'},
  {id:'unoOf',     nombre:'1v1 ofensivo'},
  {id:'unoDef',    nombre:'1v1 defensivo'},
  {id:'decision',  nombre:'Toma de decisión'},
  {id:'ubicacion', nombre:'Ubicación'}
];
const CONDUCTA = [
  {id:'puntualidad', nombre:'Puntualidad'},
  {id:'entrenos',    nombre:'Entrenamientos'},
  {id:'actitud',     nombre:'Actitud y compromiso'}
];

const FORMACIONES = {
  '4-3-3':[['Arquero',50,92],['Lateral Izquierdo',15,74],['Central Izquierdo',38,79],['Central Derecho',62,79],['Lateral Derecho',85,74],
           ['Mediocampista Interior',28,54],['Mediocampista Defensivo',50,62],['Mediocampista Interior',72,54],
           ['Extremo Izquierdo',16,24],['Delantero Centro',50,14],['Extremo Derecho',84,24]],
  '4-4-2':[['Arquero',50,92],['Lateral Izquierdo',15,74],['Central Izquierdo',38,79],['Central Derecho',62,79],['Lateral Derecho',85,74],
           ['Volante Izquierdo',15,50],['Mediocampista Defensivo',38,55],['Mediocampista Interior',62,55],['Volante Derecho',85,50],
           ['Delantero Centro',37,17],['Delantero Centro',63,17]],
  '3-5-2':[['Arquero',50,92],['Central Izquierdo',30,79],['Central',50,82],['Central Derecho',70,79],
           ['Volante Izquierdo',11,52],['Mediocampista Defensivo',33,58],['Enganche',50,42],['Mediocampista Interior',67,58],['Volante Derecho',89,52],
           ['Delantero Centro',37,16],['Delantero Centro',63,16]],
  '4-3-1-2':[['Arquero',50,92],['Lateral Izquierdo',15,74],['Central Izquierdo',38,79],['Central Derecho',62,79],['Lateral Derecho',85,74],
           ['Mediocampista Interior',24,58],['Mediocampista Defensivo',50,64],['Mediocampista Interior',76,58],
           ['Enganche',50,38],
           ['Delantero Centro',37,15],['Delantero Centro',63,15]]
};

const ORDENES = [
  {id:'apellido',  nombre:'A-Z'},
  {id:'pj',        nombre:'Partidos'},
  {id:'goles',     nombre:'Goles'},
  {id:'amarillas', nombre:'Amarillas'},
  {id:'rojas',     nombre:'Rojas'},
  {id:'nota',      nombre:'Nota'}
];

const FASES = [
  {id:'activacion', nombre:'Entrada en calor',  color:'#8AA1B1'},
  {id:'tecnica',    nombre:'Técnica',           color:'#2E7D46'},
  {id:'tactica',    nombre:'Táctica',           color:'#1F5FA9'},
  {id:'fisico',     nombre:'Físico',            color:'#EA5B0C'},
  {id:'reducido',   nombre:'Juego reducido',    color:'#7A4FBF'},
  {id:'abp',        nombre:'Pelota parada',     color:'#C98A00'},
  {id:'juego',      nombre:'Fútbol formal',     color:'#111111'},
  {id:'vuelta',     nombre:'Vuelta a la calma', color:'#6C6862'}
];
const fase = id => FASES.find(f=>f.id===id) || {nombre:'—', color:'#999'};

let db = { jugadores:[], tomas:[], evaluaciones:[], partidos:[], ejercicios:[], sesiones:[], config:{rol:'Coordinador', categoriaDT:'', acceso:null} };

/* La clave es una puerta para no editar sin querer, no un candado: viaja en el
   HTML y cualquiera que mire el código fuente la ve. */
const CLAVE_COORD = '20coordhsm26';
const esCoord = () => db.config.acceso === 'coordinacion';
let view = { tab:'plantel', categoria:'Todas', jugadorId:null, form:null, jugadorSel:null,
             tomaSel:null, formacion:'4-3-3', alineacion:{}, slotAbierto:null,
             sub:'sesiones', faseFiltro:'Todas', sesionId:null, ejercicioId:null, draft:null,
             editJugador:null, partidoCat:null, partidoFecha:null, partidoRival:'', orden:'apellido', fichaTab:'general', puerta:null, claveMal:false };
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto',
  'Septiembre','Octubre','Noviembre','Diciembre'];
const nombreMes = ym => { const [a,m] = ym.split('-'); return MESES[Number(m)-1]+' '+a; };

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoy = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function edad(f){ if(!f) return null; const n=new Date(f),h=new Date(); let a=h.getFullYear()-n.getFullYear();
  const m=h.getMonth()-n.getMonth(); if(m<0||(m===0&&h.getDate()<n.getDate()))a--; return a>=0&&a<100?a:null; }
function nomb(j){ return (j.apellido||'').toUpperCase()+(j.nombre?', '+j.nombre:''); }
function corto(j){ return (j.apellido||'').toUpperCase(); }
function inic(j){ return ((j.apellido||'?')[0]+((j.nombre||'')[0]||'')).toUpperCase(); }
function posiciones(j){ return j.posiciones && j.posiciones.length ? j.posiciones : []; }
function posPrincipal(j){ return posiciones(j)[0] || ''; }
const ABREV = {'Arquero':'ARQ','Lateral Derecho':'LD','Lateral Izquierdo':'LI','Central Derecho':'CD',
  'Central Izquierdo':'CI','Central':'CEN','Mediocampista Defensivo':'MCD','Mediocampista Interior':'MI',
  'Volante Derecho':'VD','Volante Izquierdo':'VI','Enganche':'ENG','Extremo Derecho':'ED',
  'Extremo Izquierdo':'EI','Delantero Centro':'DC'};
const abrev = p => ABREV[p] || (p||'').slice(0,3).toUpperCase();
/* 0 = su puesto, 1 = lo declaró como alternativo, 1.5 = misma familia, 2 = no es lo suyo */
const familia = p => (p||'').split(' ')[0];
function afinidad(j,pos){
  const p = posiciones(j); const i = p.indexOf(pos);
  if (i === 0) return 0;
  if (i > 0) return 1;
  return p.some(x=>familia(x)===familia(pos)) ? 1.5 : 2;
}

/* categorías visibles según el rol */
function catsPermitidas(){
  return db.config.rol === 'DT' && db.config.categoriaDT ? [db.config.categoriaDT] : CATEGORIAS;
}
function puedeVer(j){
  const p = catsPermitidas();
  const cats = j.categorias || [];
  /* sin categoría: los ve la coordinación, para poder completarlos */
  if (!cats.length) return db.config.rol !== 'DT';
  return cats.some(c => p.includes(c));
}
function jugadoresVisibles(){ return db.jugadores.filter(puedeVer); }

/* orden del plantel: alfabético, o de mayor a menor por la columna elegida */
function ordenarPlantel(lista, cat){
  const az = (a,b)=>(a.apellido||'').localeCompare(b.apellido||'');
  const o = view.orden || 'apellido';
  if (o==='apellido') return lista.sort(az);
  const valor = j => {
    if (o==='nota') return promedioTecnico(j.id) ?? -1;
    const t = totalesTemporada(j.id, cat);
    return t[o] || 0;
  };
  return lista.sort((a,b)=> (valor(b)-valor(a)) || az(a,b));
}

/* la app trae tres bases embebidas; esto dice cuáles faltan cargar */
function faltaCargar(){
  const hay = {}; db.jugadores.forEach(j=>{ hay[keyJugador(j)] = 1; });
  return {
    club:      !db.jugadores.length,
    juveniles: db.jugadores.length && !db.jugadores.some(j=>(j.historial||[]).length),
    planteles: db.jugadores.length && SEED_PLANTELES.nuevos.some(n=>!hay[n.key])
  };
}
function botonesPendientes(){
  if (!esCoord()) return '';
  const f = faltaCargar(); let h = '';
  if (f.juveniles) h += `<div class="gap"></div><button class="btn btn-naranja" id="cargarJuv">Cargar datos de Juveniles</button>`;
  if (f.planteles) h += `<div class="gap"></div><button class="btn btn-naranja" id="cargarPlanteles">Cargar planteles del club</button>`;
  return h;
}

function tomasOrden(){ return [...db.tomas].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')); }
function evalsDe(id){
  const orden = tomasOrden().map(t=>t.id);
  return db.evaluaciones.filter(e=>e.jugadorId===id).sort((a,b)=>orden.indexOf(a.tomaId)-orden.indexOf(b.tomaId));
}
function promedioTecnico(id){
  const evs = evalsDe(id); if(!evs.length) return null;
  for (let i=evs.length-1;i>=0;i--){
    const v = TECNICO.map(t=>evs[i][t.id]).filter(x=>typeof x==='number');
    if (v.length) return v.reduce((a,b)=>a+b,0)/v.length;
  }
  return null;
}
/* misma key que usa la base del club: apellido+nombre sin acentos ni espacios */
const keyJugador = j => ((j.apellido||'')+(j.nombre||''))
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase();

/* temporadas anteriores: totales anuales importados, sin partido a partido */
function historialDe(j){ return [...(j.historial||[])].sort((a,b)=>(a.anio||'').localeCompare(b.anio||'')); }
function historialTotal(j){
  return historialDe(j).reduce((a,x)=>({
    pj:a.pj+(x.pj||0), goles:a.goles+(x.goles||0), asistencias:a.asistencias+(x.asis||0),
    minutos:a.minutos+(x.min||0), amarillas:a.amarillas+(x.ta||0), rojas:a.rojas+(x.tr||0)
  }),{pj:0,goles:0,asistencias:0,minutos:0,amarillas:0,rojas:0});
}
function partidosDe(id, cat){
  return db.partidos.filter(p=>p.jugadorId===id && (!cat||cat==='Todas'||p.categoria===cat));
}
function baseCat(j, cat){
  const filas = (j && j.base || []).filter(b=>!cat||cat==='Todas'||b.categoria===cat);
  return filas.reduce((a,b)=>({pj:a.pj+(b.pj||0), goles:a.goles+(b.goles||0),
    amarillas:a.amarillas+(b.ta||0), rojas:a.rojas+(b.tr||0)}),{pj:0,goles:0,amarillas:0,rojas:0});
}
/* filas del historial de un año concreto */
function historialAnio(j, anio, cat){
  return (j && j.historial || []).filter(x=>String(x.anio).startsWith(anio)
      && (!cat || cat==='Todas' || !x.categoria || x.categoria===cat))
    .reduce((a,x)=>({pj:a.pj+(x.pj||0), goles:a.goles+(x.goles||0), asistencias:a.asistencias+(x.asis||0),
      minutos:a.minutos+(x.min||0), amarillas:a.amarillas+(x.ta||0), rojas:a.rojas+(x.tr||0)}),
      {pj:0,goles:0,asistencias:0,minutos:0,amarillas:0,rojas:0});
}
/* la temporada en curso: partidos cargados + planilla + lo del año que vino agregado */
const ANIO_ACTUAL = String(new Date().getFullYear());
function totalesTemporada(id, cat){
  const j = db.jugadores.find(x=>x.id===id);
  const t = totalesConBase(id,cat), a = historialAnio(j, ANIO_ACTUAL, cat);
  return {pj:t.pj+a.pj, goles:t.goles+a.goles, asistencias:t.asistencias+a.asistencias,
    minutos:t.minutos+a.minutos, amarillas:t.amarillas+a.amarillas, rojas:t.rojas+a.rojas};
}

/* lo cargado partido a partido más la base de planilla de esa categoría */
function totalesConBase(id, cat){
  const j = db.jugadores.find(x=>x.id===id);
  const t = totales(id,cat), b = baseCat(j,cat);
  return {...t, pj:t.pj+b.pj, goles:t.goles+b.goles,
    amarillas:t.amarillas+b.amarillas, rojas:t.rojas+b.rojas};
}
function totales(id, cat){
  return partidosDe(id,cat).reduce((a,p)=>({
    pj:a.pj+(p.jugo?1:0), goles:a.goles+(p.goles||0), asistencias:a.asistencias+(p.asistencias||0),
    minutos:a.minutos+(p.minutos||0), amarillas:a.amarillas+(p.amarillas||0), rojas:a.rojas+(p.rojas||0)
  }),{pj:0,goles:0,asistencias:0,minutos:0,amarillas:0,rojas:0});
}
/* asistencia acumulada: solo cuenta sesiones donde se pasó lista */
function asistenciaDe(id){
  const j = db.jugadores.find(x=>x.id===id); if(!j) return null;
  const relevantes = db.sesiones.filter(s=>(s.asistentes||[]).length && (j.categorias||[]).includes(s.categoria));
  if (!relevantes.length) return null;
  const fue = relevantes.filter(s=>s.asistentes.includes(id)).length;
  return { fue, total: relevantes.length, pct: Math.round(fue/relevantes.length*100) };
}
function pjPorPosicion(id){
  const m = {};
  db.partidos.filter(p=>p.jugadorId===id && p.jugo).forEach(p=>{
    const k = p.posicion || 'Sin registrar';
    m[k] = (m[k]||0)+1;
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
/* última toma que tenga alguno de esos ítems cargados */
function ultimaCon(id, ids){
  const evs = evalsDe(id);
  for (let i=evs.length-1;i>=0;i--){
    const v = ids.map(k=>evs[i][k]).filter(x=>typeof x==='number');
    if (v.length) return { ev:evs[i], valores:v };
  }
  return null;
}
const promedioDe = (id, lista) => {
  const r = ultimaCon(id, lista.map(x=>x.id));
  return r ? r.valores.reduce((a,b)=>a+b,0)/r.valores.length : null;
};
/* nota general: promedio de lo técnico-táctico y lo de comportamiento */
const puntuacion = id => promedioDe(id, [...TECNICO, ...CONDUCTA]);

/* los ítems más flojos de la última toma */
function aMejorar(j){
  const items = [...TECNICO.map(x=>({...x,grupo:'Técnico-táctico'})),
                 ...CONDUCTA.map(x=>({...x,grupo:'Comportamiento'}))];
  const r = ultimaCon(j.id, items.map(x=>x.id));
  const out = [];
  if (r) items.forEach(i=>{ const v = r.ev[i.id];
    if (typeof v==='number' && v<7) out.push({nombre:i.nombre, valor:v, grupo:i.grupo}); });
  if (j.piernaMala && j.piernaMala<=2)
    out.push({nombre:'Pierna inhábil', valor:j.piernaMala*2, grupo:'Físico', crudo:`${j.piernaMala}/5`});
  return out.sort((a,b)=>a.valor-b.valor).slice(0,3);
}
/* último valor de cada test físico */
function fisicoUltimo(id){
  const evs = evalsDe(id), out = {};
  FISICO.forEach(f=>{ for (let i=evs.length-1;i>=0;i--){
    if (typeof evs[i][f.id]==='number'){ out[f.id]=evs[i][f.id]; break; } } });
  return out;
}

const claseSem = v => v==null?'s-vacio':(v>=7?'s-alto':v>=5?'s-medio':'s-bajo');
const colorSem = v => v>=7?'var(--verde)':v>=5?'var(--ambar)':'var(--rojo)';

  if (view.tab==='entrenos')return pantallaEntrenos();

}

/* ---------- PLANTEL ---------- */
function pantallaPlantel(){
  const cats = catsPermitidas();
  /* no mostramos categorías sin nadie: solo ensucian */
  const usadas = cats.filter(c=>jugadoresVisibles().some(j=>(j.categorias||[]).includes(c)));
  const conJugadores = usadas.length ? usadas : cats;
  if (!cats.includes(view.categoria) && view.categoria!=='Todas') view.categoria='Todas';
  const lista = ordenarPlantel(jugadoresVisibles()
    .filter(j => view.categoria==='Todas' || (j.categorias||[]).includes(view.categoria)),
    view.categoria);

  let h = `<h2 class="screen-title">Plantel</h2>
    <p class="screen-note">${jugadoresVisibles().length} jugadores. La nota es el promedio técnico-táctico de la última toma.</p>
    <div class="chips">${['Todas',...conJugadores].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${view.categoria===c}">${esc(c)}</button>`).join('')}</div>
    <span class="label" style="display:block;margin-bottom:6px">Ordenar por</span>
    <div class="chips">${ORDENES.map(o=>`<button class="chip" data-orden="${o.id}" aria-pressed="${(view.orden||'apellido')===o.id}">${esc(o.nombre)}</button>`).join('')}</div>`;

  const pendientes = botonesPendientes();
  if (db.jugadores.length && pendientes){
    h += `<div class="block" style="border-color:var(--naranja)">
      <div class="block-title">Falta cargar</div>
      <p class="screen-note" style="margin:0">La app trae más datos embebidos que todavía no están en esta base.</p>
      ${pendientes}</div>`;
  }

  if (!db.jugadores.length && !esCoord()){
    h += `<div class="empty"><p>Todavía no hay datos cargados. Pedile a coordinación que los cargue.</p></div>`;
  } else if (!db.jugadores.length){
    h += `<div class="empty"><p>Todavía no hay jugadores. Podés cargar el plantel real desde la planilla del club, o probar con datos de ejemplo.</p>
      <button class="btn btn-naranja" id="cargarHSM">Cargar plantel del club</button><div class="gap"></div>
      <button class="btn btn-ghost" data-go="nuevoJugador">Agregar uno a mano</button><div class="gap"></div>
      <button class="btn btn-ghost" id="seed">Datos de ejemplo</button></div>`;
  } else if (!lista.length){
    h += `<div class="empty"><p>No hay jugadores en ${esc(view.categoria)}.</p>
      ${botonesPendientes()?`<p class="screen-note">Puede que falte cargar datos: mirá "Falta cargar" arriba.</p>`:''}</div>`;
  } else {
    h += `<div class="roster">`+lista.map(j=>{
      const p = promedioTecnico(j.id), t = totalesTemporada(j.id, view.categoria), e = edad(j.fechaNac);
      return `<button class="row" data-jugador="${j.id}">
        <span class="dorsal">${esc(inic(j))}</span>
        <span class="row-main"><span class="row-name">${esc(nomb(j))}</span>
        <span class="row-meta">
          ${e!==null?`<span>${e} a.</span>`:''}
          ${!(j.categorias||[]).length?`<span class="pill" style="border-color:var(--rojo);color:var(--rojo)">sin categoría</span>`:''}
          ${(j.categorias||[]).length>1?`<span class="pill">${(j.categorias||[]).length} categorías</span>`:''}
          <span>${t.pj} PJ · ${t.goles} G</span>
          ${t.amarillas?`<span><i class="card-mark card-y"></i>${t.amarillas}</span>`:''}
          ${t.rojas?`<span><i class="card-mark card-r"></i>${t.rojas}</span>`:''}
        </span></span>

    }).join('')+`</div><div class="gap"></div>
    ${esCoord()?`<button class="btn btn-ghost" data-go="nuevoJugador">Agregar jugador</button>`:''}`;

   <div class="ficha-head">
     <div class="ficha-name">${esc(nomb(j))}</div>

        <div class="stat"><div class="stat-label">General</div>

        <div class="stat"><div class="stat-label">Comportamiento</div>

    const hist = historialDe(j).filter(x=>!String(x.anio).startsWith(ANIO_ACTUAL));
    if (hist.length){
      const H = hist.reduce((a,x)=>({pj:a.pj+(x.pj||0),goles:a.goles+(x.goles||0),asistencias:a.asistencias+(x.asis||0),minutos:a.minutos+(x.min||0),amarillas:a.amarillas+(x.ta||0),rojas:a.rojas+(x.tr||0)}),{pj:0,goles:0,asistencias:0,minutos:0,amarillas:0,rojas:0}), P = totalesTemporada(j.id);
      h += `<div class="block"><div class="block-title">Temporadas anteriores <span>${hist.length} año${hist.length>1?'s':''}</span></div>
        <div class="scroll-x"><table class="cmp"><thead><tr>
          <th>Año</th><th>PJ</th><th>Goles</th><th>Asist.</th><th>Min</th><th>Amar.</th><th>Rojas</th></tr></thead><tbody>`;
      hist.forEach(x=>{
        h += `<tr><td>${esc(x.anio)}</td><td class="val">${x.pj||0}</td><td class="val">${x.goles||0}</td>
          <td class="val">${x.asis||0}</td><td class="val">${x.min||0}</td><td class="val">${x.ta||0}</td>
          <td class="val">${x.tr||0}</td></tr>`;
      });
      h += `<tr><td><strong>Carrera</strong></td><td class="val">${H.pj+P.pj}</td><td class="val">${H.goles+P.goles}</td>
        <td class="val">${H.asistencias+P.asistencias}</td><td class="val">${H.minutos+P.minutos}</td>
        <td class="val">${H.amarillas+P.amarillas}</td><td class="val">${H.rojas+P.rojas}</td></tr></tbody></table></div>
        <p class="screen-note" style="margin-top:8px">Totales anuales importados; de esos años no hay partido a partido.
        "Carrera" los suma con la temporada ${ANIO_ACTUAL} de arriba.</p></div>`;
    }

    if ((j.base||[]).length){
      h += `<div class="block"><div class="block-title">Según planilla <span>${j.base.length} categoría${j.base.length>1?'s':''}</span></div>
        <div class="scroll-x"><table class="cmp"><thead><tr>
          <th>Categoría</th><th>PJ</th><th>Goles</th><th>Amar.</th><th>Rojas</th></tr></thead><tbody>
        ${j.base.map(b=>`<tr><td>${esc(b.categoria)}</td><td class="val">${b.pj||0}</td>
          <td class="val">${b.goles||0}</td><td class="val">${b.ta||0}</td><td class="val">${b.tr||0}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="screen-note" style="margin-top:8px">Totales de la planilla del club, sin partido a partido.
        Ya están sumados arriba; si cargás esos partidos uno por uno se contarían dos veces.</p></div>`;
    }

    const asis = asistenciaDe(j.id);
    if (asis){
      const col = asis.pct>=85?'var(--verde)':(asis.pct>=65?'var(--ambar)':'var(--rojo)');
      h += `<div class="block"><div class="block-title">Entrenamientos</div>
        <div class="bar-row" style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;width:130px;flex:0 0 130px">Asistencia</span>
          <span style="flex:1;height:8px;background:var(--wash);border-radius:99px;overflow:hidden">
            <span style="display:block;height:100%;width:${asis.pct}%;background:${col};border-radius:99px"></span></span>
          <span style="font-family:var(--mono);font-size:13px;font-weight:600;color:${col};width:44px;text-align:right">${asis.pct}%</span></div>
        <p class="screen-note" style="margin-top:8px">Vino a ${asis.fue} de ${asis.total} entrenamientos con lista tomada.</p></div>`;
    }
  }

  /* ===================== DETALLE ===================== */
  if (tab==='detalle'){
    if (!evs.length){
      h += `<div class="block"><div class="block-title">Evaluaciones</div>
        <div class="empty"><p>Sin evaluaciones. Cargá la primera toma y a partir de la segunda vas a ver la comparativa.</p></div></div>`;
    } else {
      const nombreToma = id => (db.tomas.find(t=>t.id===id)||{}).nombre || '—';
      const tablas = [
        ['Físico', FISICO.map(f=>({id:f.id,nombre:f.nombre,unidad:f.unidad,mejor:f.mejor,dec:f.dec||0}))],
        ['Técnico-táctico', TECNICO.map(t=>({...t,mejor:'alto',dec:0,escala:true}))],
        ['Comportamiento', CONDUCTA.map(t=>({...t,mejor:'alto',dec:0,escala:true}))]
      ];
      tablas.forEach(([titulo,items])=>{
        const usados = items.filter(i=>evs.some(e=>typeof e[i.id]==='number'));
        if (!usados.length) return;
        h += `<div class="block"><div class="block-title">${titulo} <span>${evs.length} toma${evs.length>1?'s':''}</span></div>
          <div class="scroll-x"><table class="cmp"><thead><tr><th>Ítem</th>
          ${evs.map(e=>`<th>${esc(nombreToma(e.tomaId))}</th>`).join('')}</tr></thead><tbody>`;
        usados.forEach(i=>{
          h += `<tr><td>${esc(i.nombre)}${i.unidad?` <span class="flat" style="font-family:var(--mono);font-size:10px">${esc(i.unidad)}</span>`:''}</td>`;
          evs.forEach((e,k)=>{
            const v = e[i.id];
            if (typeof v!=='number'){ h += `<td class="val flat">—</td>`; return; }
            const col = i.escala ? colorSem(v) : 'var(--ink)';
            let d = '';
            const prev = k>0 ? [...evs.slice(0,k)].reverse().find(x=>typeof x[i.id]==='number') : null;
            if (prev){
              const dif = v - prev[i.id];
              const mejora = i.mejor==='alto' ? dif>0 : dif<0;
              d = `<span class="dlt ${dif===0?'flat':(mejora?'up':'down')}">${dif>0?'+':''}${dif.toFixed(i.dec)}</span>`;
            }
            h += `<td class="val" style="color:${col}">${v.toFixed(i.dec)}${d}</td>`;
          });
          h += `</tr>`;
        });
        h += `</tbody></table></div></div>`;
      });
    }
  }

  /* ===================== POSICIONES ===================== */
  if (tab==='posiciones'){
    const pos = posiciones(j);
    h += `<div class="block"><div class="block-title">Puestos declarados</div>`;
    if (!pos.length){
      h += `<div class="empty"><p>Todavía no tiene puestos cargados.</p>
        ${esCoord()?`<button class="btn btn-ghost" data-editar="${j.id}">Cargarlos ahora</button>`:''}</div>`;
    } else {
      h += `<div class="ficha-tags">${pos.map((p,i)=>
        `<span class="tag${i===0?' cat':''}">${i===0?'':'también: '}${esc(p)}</span>`).join('')}</div>
        <p class="screen-note" style="margin-top:10px">El primero es su puesto principal; es el que la Cancha usa para sugerirlo.</p>`;
    }
    h += `</div>`;

    const porPos = pjPorPosicion(j.id);
    h += `<div class="block"><div class="block-title">Dónde jugó <span>${porPos.length} puesto${porPos.length===1?'':'s'}</span></div>`;
    if (!porPos.length){
      h += `<div class="empty"><p>Sin partidos con el puesto anotado. Cargá un partido eligiendo el puesto de cada uno y acá vas a ver dónde jugó de verdad.</p></div>`;
    } else {
      const total = porPos.reduce((a,b)=>a+b[1],0);
      porPos.forEach(([p,n])=>{
        const af = afinidad(j,p);
        const col = af===0?'var(--verde)':(af===1?'var(--naranja)':'var(--ink-2)');
        h += `<div class="bar-row" style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-size:13px;width:130px;flex:0 0 130px">${esc(p)}</span>
          <span style="flex:1;height:8px;background:var(--wash);border-radius:99px;overflow:hidden">
            <span style="display:block;height:100%;width:${Math.round(n/total*100)}%;background:${col};border-radius:99px"></span></span>
          <span style="font-family:var(--mono);font-size:13px;font-weight:600;width:34px;text-align:right">${n} PJ</span></div>`;
      });
      h += `<p class="screen-note" style="margin-top:10px">Verde: es su puesto. Naranja: puesto alternativo. Gris: jugó ahí sin tenerlo declarado.</p>`;
    }
    h += `</div>`;
  }

  if (esCoord()) h += `<div class="block">
    <button class="btn btn-naranja" data-go="cargarPara">Cargar datos de ${esc(j.nombre||j.apellido)}</button>
    <div class="gap"></div><button class="btn btn-ghost" data-editar="${j.id}">Editar datos del jugador</button>
    <div class="gap"></div><button class="btn btn-danger" data-borrar="${j.id}">Eliminar jugador</button></div>`;
  app.innerHTML = h;
}

/* ---------- CANCHA ---------- */
function pantallaCancha(){
  const cats = catsPermitidas();
  if (view.categoria==='Todas' || !cats.includes(view.categoria)) view.categoria = cats[0];
  const slots = FORMACIONES[view.formacion];
  const asignados = view.alineacion[view.categoria] || {};

  let h = `<h2 class="screen-title">Cancha</h2>
    <p class="screen-note">Armá el once de la categoría. Tocá un puesto para elegir jugador; el color de la nota te dice cómo viene.</p>
    <div class="chips">${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${view.categoria===c}">${esc(c)}</button>`).join('')}</div>
    <div class="chips">${Object.keys(FORMACIONES).map(f=>`<button class="chip" data-form="${f}" aria-pressed="${view.formacion===f}">${f}</button>`).join('')}</div>
    <div class="pitch">
      <svg class="lines" viewBox="0 0 68 100" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="#CFCBC4" stroke-width=".5">
          <rect x="1.5" y="1.5" width="65" height="97"/>
          <line x1="1.5" y1="50" x2="66.5" y2="50"/>
          <circle cx="34" cy="50" r="9"/>
          <rect x="16" y="1.5" width="36" height="15"/><rect x="16" y="83.5" width="36" height="15"/>
          <rect x="26" y="1.5" width="16" height="6"/><rect x="26" y="92.5" width="16" height="6"/>
        </g>
      </svg>`;

  slots.forEach((s,i)=>{
    const [pos,x,y] = s;
    const jid = asignados[i];
    const j = jid ? db.jugadores.find(p=>p.id===jid) : null;
    const nota = j ? promedioTecnico(j.id) : null;
    h += `<button class="slot ${j?'lleno':''}" style="left:${x}%;top:${y}%" data-slot="${i}">
      <span class="bubble">${j ? (nota!==null?nota.toFixed(1):'·') : '+'}</span>
      <span class="cap">${j?esc(corto(j)):''}</span>
      <span class="pos">${esc(abrev(pos))}</span></button>`;
  });
  h += `</div>`;

  const puestos = Object.keys(asignados).length;
  h += `<div class="gap"></div>
    <p class="screen-note">${puestos} de 11 puestos cubiertos${puestos?` · <button class="chip" id="limpiarOnce">Vaciar</button>`:''}</p>`;

  if (view.slotAbierto !== null){
    const [pos] = slots[view.slotAbierto];
    const yaPuestos = Object.entries(asignados).filter(([k])=>Number(k)!==view.slotAbierto).map(([,v])=>v);
    const cand = jugadoresVisibles()
      .filter(j=>(j.categorias||[]).includes(view.categoria))
      .filter(j=>!yaPuestos.includes(j.id))
      .sort((a,b)=>{
        const d = afinidad(a,pos)-afinidad(b,pos);
        if (d) return d;
        return (promedioTecnico(b.id)??0)-(promedioTecnico(a.id)??0);
      });
    h += `<div class="block"><div class="block-title">Elegir ${esc(pos)}</div>`;
    h += cand.length ? `<div class="roster">`+cand.map(j=>{
        const n = promedioTecnico(j.id);
        const af = afinidad(j,pos);
        const etiqueta = af===0 ? `<span class="pill" style="border-color:var(--verde);color:var(--verde)">su puesto</span>`
                       : af===1 ? `<span class="pill" style="border-color:var(--naranja);color:var(--naranja)">también juega acá</span>`
                       : af===1.5 ? `<span class="pill">${esc(posPrincipal(j))} · mismo sector</span>`
                       : `<span>${esc(posPrincipal(j)||'sin posición')}</span>`;
        return `<button class="row" data-asignar="${j.id}">
          <span class="dorsal">${esc(inic(j))}</span>
          <span class="row-main"><span class="row-name">${esc(nomb(j))}</span>
          <span class="row-meta">${etiqueta}</span></span>
          <span class="score ${claseSem(n)}">${n!==null?n.toFixed(1):'—'}</span></button>`;
      }).join('')+`</div><div class="gap"></div><button class="btn btn-ghost" data-asignar="">Dejar vacío</button>`
      : `<div class="empty"><p>No hay jugadores en ${esc(view.categoria)}.</p></div>`;
    h += `</div>`;
  }
  app.innerHTML = h;
}

/* ---------- CARGAR ---------- */
function pantallaCargar(){
  if (!view.form){
    app.innerHTML = `<h2 class="screen-title">Cargar</h2><p class="screen-note">¿Qué vas a registrar?</p>
      <div class="roster">${[
        ['evaluacion','Evaluación de la toma','Físico, técnico-táctico y comportamiento'],
        ['partido','Partido','Todo el plantel en una lista'],
        ['nuevoJugador','Nuevo jugador','Alta con carnet y categorías'],
        ['nuevaToma','Nueva toma','Abrir el ciclo de marzo, julio, etc.']
      ].map(([k,t,s])=>`<button class="row" data-go="${k}">
        <span class="row-main"><span class="row-name">${t}</span><span class="row-meta"><span>${s}</span></span></span>
        <span style="color:var(--ink-2)">›</span></button>`).join('')}</div>`;

function selJugador(){
  const l = jugadoresVisibles().sort((a,b)=>(a.apellido||'').localeCompare(b.apellido||''));
  if (!l.length) return `<div class="empty"><p>Primero cargá jugadores.</p></div>`;
  const sel = l.find(j=>j.id===view.jugadorSel) || l[0];
  return `<div class="field"><label class="label" for="f-jugador">Jugador</label><select id="f-jugador">
    ${l.map(j=>`<option value="${j.id}" ${sel && sel.id===j.id?'selected':''}>${esc(nomb(j))}</option>`).join('')}
    </select></div>
    <div id="f-perfil">${perfilJugador(sel)}</div>`;
}
/* lo que hay que tener a mano al cargarle datos: categorías, dónde juega y con qué pierna */
function perfilJugador(j){
  if (!j) return '';
  const pos = posiciones(j), cats = j.categorias || [];
  const tags = [
    ...cats.map(c=>`<span class="tag cat">${esc(c)}</span>`),
    ...pos.map((x,i)=>`<span class="tag">${i===0?'':'también: '}${esc(x)}</span>`),
    j.pierna ? `<span class="tag">${esc(j.pierna)}</span>` : '',
    j.piernaMala ? `<span class="tag">pierna inhábil ${j.piernaMala}/5</span>` : ''
  ].filter(Boolean);
  if (!tags.length) return `<p class="screen-note" style="margin:-6px 0 14px">
    Sin categorías ni posiciones cargadas. Completalas en la ficha del jugador.</p>`;
  return `<div class="ficha-tags" style="margin:-6px 0 14px">${tags.join('')}
    ${pos.length?'':`<span class="tag" style="border-color:var(--rojo);color:var(--rojo)">sin posiciones</span>`}</div>`;
}
function escala(id,nombre){
  return `<div class="field"><span class="label">${esc(nombre)}<em>1 a 10</em></span>
    <div class="scale" data-scale="${id}">${Array.from({length:10},(_,i)=>
      `<button type="button" data-v="${i+1}" aria-pressed="false">${i+1}</button>`).join('')}</div></div>`;
}
function stepper(id,nombre,max){
  return `<div class="field"><span class="label">${esc(nombre)}</span>
    <div class="stepper" data-step="${id}" data-max="${max}">
      <button type="button" data-d="-1" aria-label="Restar">−</button><output>0</output>
      <button type="button" data-d="1" aria-label="Sumar">+</button></div></div>`;
}

    <div class="block-title">Técnico-táctico</div>

function formPartido(){
  const cats = catsPermitidas();
  /* arranca en la última que cargaste; si es la primera vez, en la que venías mirando */
  if (!view.partidoCat || !cats.includes(view.partidoCat)){
    const sirve = c => c && cats.includes(c) && planteldeCategoria(c).length;
    view.partidoCat = [db.config.ultimaCatPartido, view.categoria].find(sirve)
      || cats.find(c=>planteldeCategoria(c).length) || cats[0];
  }
  const cat = view.partidoCat;

  const fecha = view.partidoFecha || hoy();
  const celda = (j,campo)=>`<td><input type="number" inputmode="numeric" min="0"
    data-jug="${j.id}" data-campo="${campo}" placeholder="0"></td>`;

    <h2 class="screen-title">Partido</h2>

    <div class="field"><label class="label" for="p-cat">Categoría</label>
      <select id="p-cat">${cats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="two">
      <div class="field"><label class="label" for="p-fecha">Fecha</label>
        <input type="date" id="p-fecha" value="${esc(fecha)}"></div>
      <div class="field"><label class="label" for="p-rival">Rival<em>opcional</em></label>
        <input type="text" id="p-rival" value="${esc(view.partidoRival||'')}"></div>
    </div>
    ${!plantel.length ? `<div class="empty"><p>No hay jugadores en ${esc(cat)}.</p></div>` : `
    <div class="block-title">Plantel <span>${plantel.length} jugadores</span></div>
    <div class="scroll-x"><table class="pl-tabla"><thead><tr>
      <th>Jugador</th><th>Min</th><th>Gol</th><th>Ast</th><th>TA</th><th>TR</th><th>Puesto</th>
    </tr></thead><tbody>
      ${plantel.map(j=>`<tr data-fila="${j.id}">
        <td>${esc(corto(j))}${j.nombre?` <span style="color:var(--ink-2);font-weight:400">${esc(j.nombre.split(' ')[0][0])}.</span>`:''}</td>
        ${celda(j,'minutos')}${celda(j,'goles')}${celda(j,'asistencias')}${celda(j,'amarillas')}${celda(j,'rojas')}
        <td><select data-jug="${j.id}" data-campo="posicion"><option value="">—</option>${
          POSICIONES.map(x=>`<option ${x===posPrincipal(j)?'selected':''}>${esc(x)}</option>`).join('')}</select></td>
      </tr>`).join('')}
    </tbody></table></div>
    <p class="screen-note" style="margin-top:10px">El puesto viene con la posición principal de cada uno;
    cambialo si jugó en otro lado. Eso alimenta "Dónde jugó" en la ficha.</p>
    <div class="gap"></div>
    <button class="btn btn-naranja" id="guardarPartidoPlantel">Guardar partido</button>`}
    <div style="height:26px"></div>`;
}

async function guardarPartidoPlantel(){
  const cat = document.getElementById('p-cat').value;
  const fecha = document.getElementById('p-fecha').value || hoy();
  const rival = document.getElementById('p-rival').value.trim();
  const plantel = planteldeCategoria(cat);
  if (!plantel.length) return toast('No hay jugadores en '+cat);

  const leer = (id,campo)=>{
    const el = document.querySelector(`[data-jug="${id}"][data-campo="${campo}"]`);
    if (!el) return 0;
    const n = Number(el.value);
    return Number.isFinite(n) && n>0 ? Math.round(n) : 0;
  };
  const filas = plantel.map(j=>({ id:j.id,
    minutos:leer(j.id,'minutos'), goles:leer(j.id,'goles'), asistencias:leer(j.id,'asistencias'),
    amarillas:leer(j.id,'amarillas'), rojas:leer(j.id,'rojas'),
    posicion:(document.querySelector(`[data-jug="${j.id}"][data-campo="posicion"]`)||{}).value || '' }));

  const jugaron = filas.filter(f=>f.minutos>0).length;
  if (!jugaron && !confirm('Ningún jugador tiene minutos cargados. ¿Guardar igual?')) return;

  /* si ese partido ya estaba cargado, se reemplaza en vez de duplicarse */
  const mismo = p => p.fecha===fecha && p.categoria===cat && (p.rival||'')===rival;
  const previos = db.partidos.filter(mismo).length;
  if (previos){
    if (!confirm(`Ya hay un partido del ${fecha} contra ${rival||'—'} en ${cat}. ¿Reemplazar sus ${previos} registros?`)) return;
    db.partidos = db.partidos.filter(p=>!mismo(p));
  }
  db.config.ultimaCatPartido = cat;
  filas.forEach(f=>db.partidos.push({ id:uid(), jugadorId:f.id, fecha, categoria:cat,
    posicion:f.posicion, rival, jugo:f.minutos>0, goles:f.goles, asistencias:f.asistencias,
    minutos:f.minutos, amarillas:f.amarillas, rojas:f.rojas }));

  await Store.save(db);
  toast(`Partido guardado · jugaron ${jugaron} de ${filas.length}`);
  view.partidoFecha=null; view.partidoRival=''; view.form=null;
  window.scrollTo(0,0); render();
}

/* ---------- ENTRENOS: sesiones + biblioteca ---------- */
const FORMATOS = ['4 vs 4','5 vs 5','6 vs 6','7 vs 7','8 vs 8','9 vs 9','10 vs 10','11 vs 11'];
function minutosSesion(s){ return (s.items||[]).reduce((a,i)=>a+(i.minutos||0),0) + (s.futbolMin||0); }
function repartoFases(sesiones){
  const m = {};
  sesiones.forEach(s=>{
    (s.items||[]).forEach(i=>{
      const ej = db.ejercicios.find(e=>e.id===i.ejercicioId); if(!ej) return;
      m[ej.fase] = (m[ej.fase]||0) + (i.minutos||0);
    });
    if (s.futbolMin) m.juego = (m.juego||0) + s.futbolMin;
  });
  return m;
}
function barraFases(m){
  const total = Object.values(m).reduce((a,b)=>a+b,0);
  if (!total) return '';
  const segs = FASES.filter(f=>m[f.id]).map(f=>
    `<span style="display:block;height:100%;width:${m[f.id]/total*100}%;background:${f.color}"></span>`).join('');
  const leyenda = FASES.filter(f=>m[f.id]).map(f=>
    `<span class="row-meta" style="margin:0"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${f.color};margin-right:5px"></i>${esc(f.nombre)} ${Math.round(m[f.id]/total*100)}%</span>`).join('');
  return `<div style="display:flex;height:12px;border-radius:99px;overflow:hidden;border:1px solid var(--linea);margin-bottom:9px">${segs}</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">${leyenda}</div>`;
}

        <button class="btn" id="seedEjercicios">Cargar base inicial</button><div class="gap"></div>

    } else {

        ${esCoord()?`<div class="gap"></div><button class="btn btn-naranja" data-go="nuevoEjercicio">Crear ejercicio</button>`:''}`;
    }
  }
  app.innerHTML = h + `<div style="height:26px"></div>`;

  const s = db.sesiones.find(x=>x.id===view.sesionId);
  if (!s){ view.sesionId=null; return render(); }
  let h = `<button class="back" data-back="1">← Entrenos</button>

    <div class="block"><div class="block-title">Reparto</div>${barraFases(repartoFases([s]))||'<p class="screen-note">Sin ejercicios.</p>'}</div>`;

    h += `<div class="block"><div class="block-title">Ejercicios</div><div class="roster">`;

        <span class="dorsal" style="background:${e?fase(e.fase).color:'#999'};color:#fff;font-size:11px">${i.minutos}'</span>

        <span class="row-meta"><span>${esc(e?fase(e.fase).nombre:'')}</span></span></span>
        <span style="color:var(--ink-2)">›</span></button>`;
    });
    h += `</div></div>`;
  }
  if ((s.asistentes||[]).length){
    const plantel = planteldeCategoria(s.categoria);
    const ausentes = plantel.filter(j=>!s.asistentes.includes(j.id));
    h += `<div class="block"><div class="block-title">Asistencia <span>${s.asistentes.length} de ${plantel.length}</span></div>
      <div class="multi" style="margin-bottom:12px">${s.asistentes.map(id=>{
        const j = db.jugadores.find(x=>x.id===id); if(!j) return '';
        return `<span class="tag cat">${esc(corto(j))}</span>`;
      }).join('')}</div>`;
    if (ausentes.length){
      h += `<p class="screen-note" style="margin-bottom:6px">Faltaron:</p>
        <div class="multi">${ausentes.map(j=>`<span class="tag" style="border-color:var(--rojo);color:var(--rojo)">${esc(corto(j))}</span>`).join('')}</div>`;
    }
    h += `</div>`;

  if (s.otros){
    h += `<div class="block"><div class="block-title">Escrito a mano</div>
      <p style="white-space:pre-wrap">${esc(s.otros)}</p>
      <div class="aviso" style="margin-top:12px">Esto no entra en el reparto de tiempo. Si es un ejercicio que se repite, conviene sumarlo a la biblioteca.</div>
      ${esCoord()?`<button class="btn btn-ghost" data-go="nuevoEjercicio">Sumarlo a la biblioteca</button>`:''}</div>`;
  }
  if (s.notas) h += `<div class="block"><div class="block-title">Notas</div><p>${esc(s.notas)}</p></div>`;
  if (esCoord()) h += `<div class="block"><button class="btn btn-danger" data-borrarSesion="${s.id}">Eliminar sesión</button></div>`;
  app.innerHTML = h + `<div style="height:26px"></div>`;

function bloqueAsistencia(d){

function marcarTab(t){ document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-current', String(x.dataset.tab===t))); }

/* la sesión se redibuja al tocar +/-, así que no se pierde lo tipeado */
function guardarBorrador(){
  if (!view.draft) return;
  const v = id => { const el=document.getElementById(id); return el?el.value:null; };
  const d = view.draft;
  if (v('s-fecha')!==null)   d.fecha = v('s-fecha');
  if (v('s-cat')!==null)     d.categoria = v('s-cat');
  if (v('s-dt')!==null)      d.dt = v('s-dt');
  if (v('s-jug')!==null)     d.jugadores = v('s-jug')===''?null:Number(v('s-jug'));
  if (v('s-formato')!==null) d.futbol = v('s-formato');
  if (v('s-futmin')!==null)  d.futbolMin = v('s-futmin')===''?0:Number(v('s-futmin'));
  if (v('s-otros')!==null)   d.otros = v('s-otros');
}

app.addEventListener('click', async e=>{
  const t = e.target;

  /* puerta de entrada; los botones tienen texto adentro, así que subimos al botón */
  const puerta = t.closest('#ac-jugador,#ac-coord');
  if (puerta && puerta.id==='ac-jugador'){ db.config.acceso='jugador'; await Store.save(db); return render(); }
  if (puerta && puerta.id==='ac-coord'){ view.puerta='clave'; view.claveMal=false; return render(); }
  if (t.id==='ac-volver'){ view.puerta=null; view.claveMal=false; return render(); }
  if (t.id==='ac-entrar'){
    const v = (document.getElementById('ac-clave')||{}).value || '';
    if (v !== CLAVE_COORD){ view.claveMal=true; return render(); }
    db.config.acceso='coordinacion'; view.puerta=null; view.claveMal=false;
    await Store.save(db); return render();
  }
  /* como jugador se mira, no se toca */
  if (!esCoord()){
    const muta = t.closest('[data-editar],[data-borrar],[data-borrarSesion],[data-borrarEj],[data-guardar],[data-go]');
    const ids = ['guardarJugador','guardarToma','guardarPartidoPlantel','guardarSesion','guardarEjercicio',
                 'cargarHSM','cargarJuv','cargarPlanteles','seed','borrarTodo'];
    if (muta || ids.includes(t.id)) return toast('Solo coordinación puede cargar o editar');
  }

  const chipCat = t.closest('.chip[data-cat]');
  if (chipCat){ view.categoria=chipCat.dataset.cat; view.slotAbierto=null; return render(); }

  const chipOrden = t.closest('.chip[data-orden]');
  if (chipOrden){ view.orden=chipOrden.dataset.orden; window.scrollTo(0,0); return render(); }

  const chipFicha = t.closest('.chip[data-ficha]');
  if (chipFicha){ view.fichaTab=chipFicha.dataset.ficha; window.scrollTo(0,0); return render(); }

  const chipForm = t.closest('.chip[data-form]');
  if (chipForm){ view.formacion=chipForm.dataset.form; view.slotAbierto=null; return render(); }

  const rolBtn = t.closest('[data-toggle="rol"] .chip');
  if (rolBtn){
    db.config.rol = rolBtn.dataset.v;
    if (db.config.rol==='DT' && !db.config.categoriaDT) db.config.categoriaDT = CATEGORIAS[2];
    view.categoria='Todas'; await Store.save(db); return render();
  }

  const slot = t.closest('[data-slot]');
  if (slot){ const i=Number(slot.dataset.slot); view.slotAbierto = view.slotAbierto===i?null:i; return render(); }

  const asig = t.closest('[data-asignar]');
  if (asig){
    const cat = view.categoria;
    view.alineacion[cat] = view.alineacion[cat] || {};
    const id = asig.dataset.asignar;
    if (id){
      /* un jugador no puede estar en dos puestos a la vez */
      Object.keys(view.alineacion[cat]).forEach(k=>{ if (view.alineacion[cat][k]===id) delete view.alineacion[cat][k]; });
      view.alineacion[cat][view.slotAbierto] = id;
    } else {
      delete view.alineacion[cat][view.slotAbierto];
    }
    view.slotAbierto=null; window.scrollTo(0,0); return render();
  }
  if (t.id==='limpiarOnce'){ view.alineacion[view.categoria]={}; return render(); }

  const asis = t.closest('[data-asis]');
  if (asis){
    guardarBorrador();
    const id = asis.dataset.asis, a = view.draft.asistentes || [];
    view.draft.asistentes = a.includes(id) ? a.filter(x=>x!==id) : [...a, id];
    return render();
  }
  if (t.closest('[data-asisTodos]')){
    guardarBorrador();
    view.draft.asistentes = planteldeCategoria(view.draft.categoria).map(j=>j.id);
    return render();
  }
  if (t.closest('[data-asisNinguno]')){
    guardarBorrador(); view.draft.asistentes = []; return render();
  }

  const subBtn = t.closest('[data-toggle="sub"] .chip');
  if (subBtn){ view.sub=subBtn.dataset.v; return render(); }

  const faseBtn = t.closest('.chip[data-fase]');
  if (faseBtn){ view.faseFiltro=faseBtn.dataset.fase; return render(); }

  const ses = t.closest('[data-sesion]');
  if (ses){ view.sesionId=ses.dataset.sesion; window.scrollTo(0,0); return render(); }

  const ej = t.closest('[data-ejercicio]');
  if (ej){ view.ejercicioId=ej.dataset.ejercicio; window.scrollTo(0,0); return render(); }

  if (t.id==='nuevaSesion'){
    const cats = catsPermitidas();
    view.draft = { fecha:hoy(), categoria: view.categoria!=='Todas'&&cats.includes(view.categoria)?view.categoria:cats[0],
                   dt:'', jugadores:null, asistentes:[], futbol:'', futbolMin:0, otros:'', items:[] };
    window.scrollTo(0,0); return render();
  }
  if (t.id==='seedEjercicios'){ return sembrarEjercicios(); }
  if (t.id==='guardarSesion'){ return guardarSesion(); }
  if (t.id==='guardarEjercicio'){ return guardarEjercicio(); }

  const addEj = t.closest('[data-addEj]');
  if (addEj){
    const e = db.ejercicios.find(x=>x.id===addEj.dataset.addej);
    guardarBorrador();
    view.draft.items.push({ ejercicioId:e.id, minutos:e.duracion||15 });
    return render();
  }
  const minBtn = t.closest('[data-min]');
  if (minBtn){
    const [k,d] = minBtn.dataset.min.split('|').map(Number);
    guardarBorrador();
    view.draft.items[k].minutos = Math.max(5, view.draft.items[k].minutos + d);
    return render();
  }
  const quitarItem = t.closest('[data-quitarItem]');
  if (quitarItem){ guardarBorrador(); view.draft.items.splice(Number(quitarItem.dataset.quitaritem),1); return render(); }

  const delSes = t.closest('[data-borrarSesion]');
  if (delSes){
    if (!confirm('¿Eliminar esta sesión?')) return;
    db.sesiones = db.sesiones.filter(s=>s.id!==delSes.dataset.borrarsesion);
    await Store.save(db); view.sesionId=null; toast('Sesión eliminada'); return render();
  }
  const delEj = t.closest('[data-borrarEj]');
  if (delEj){
    if (!confirm('¿Eliminar el ejercicio de la biblioteca? Las sesiones que lo usaron lo van a mostrar como borrado.')) return;
    db.ejercicios = db.ejercicios.filter(e=>e.id!==delEj.dataset.borrarej);
    await Store.save(db); view.ejercicioId=null; toast('Ejercicio eliminado'); return render();
  }

  const row = t.closest('[data-jugador]');
  if (row){ view.jugadorId=row.dataset.jugador; view.fichaTab='general'; window.scrollTo(0,0); return render(); }

  if (t.closest('[data-back]')){
    if (view.jugadorId) view.jugadorId=null;
    else if (view.sesionId) view.sesionId=null;
    else if (view.ejercicioId) view.ejercicioId=null;
    else if (view.draft) view.draft=null;
    else view.form=null;
    window.scrollTo(0,0); return render();
  }

  const go = t.closest('[data-go]');
  if (go){
    const d = go.dataset.go;
    if (d==='nuevoEjercicio'){
      view.tab='entrenos'; view.form=d; view.jugadorId=null;
      marcarTab('entrenos'); window.scrollTo(0,0); return render();
    }
    if (d==='cargarPara'){ view.jugadorSel=view.jugadorId; view.jugadorId=null; view.tab='cargar'; view.form='evaluacion'; }
    else { view.tab='cargar'; view.form=d; view.jugadorId=null; view.editJugador=null; }
    marcarTab('cargar'); window.scrollTo(0,0); return render();
  }

  const sc = t.closest('.scale button');
  if (sc){ sc.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===sc))); return; }

  const st = t.closest('.stepper button');
  if (st){ const box=st.closest('.stepper'), o=box.querySelector('output');
    o.textContent = Math.max(0, Math.min(Number(box.dataset.max), Number(o.textContent)+Number(st.dataset.d))); return; }

  const tg = t.closest('[data-toggle="jugo"] .chip');
  if (tg){ tg.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b===tg))); return; }

  const mc = t.closest('[data-multi] .chip');
  if (mc){ mc.setAttribute('aria-pressed', mc.getAttribute('aria-pressed')==='true'?'false':'true'); return; }

  const quitar = t.closest('[data-quitar]');

  if (t.id==='cargarHSM'){ return cargarBaseHSM(); }
  if (t.id==='cargarJuv'){ return cargarJuveniles(); }
  if (t.id==='cargarPlanteles'){ return cargarPlanteles(); }
  if (t.id==='seed'){ return sembrar(); }
  if (t.id==='guardarJugador'){ return guardarJugador(); }
  if (t.id==='guardarToma'){ return guardarToma(); }
  if (t.id==='guardarPartidoPlantel'){ return guardarPartidoPlantel(); }

  const g = t.closest('[data-guardar]');
  if (g){ return guardarRegistro(g.dataset.guardar); }

  const ed = t.closest('[data-editar]');
  if (ed){
    view.editJugador = ed.dataset.editar; view.jugadorId = null;
    view.tab='cargar'; view.form='nuevoJugador'; marcarTab('cargar');
    window.scrollTo(0,0); return render();
  }

  const del = t.closest('[data-borrar]');
  if (del){
    const j = db.jugadores.find(x=>x.id===del.dataset.borrar);
    if (!confirm(`¿Eliminar a ${nomb(j)} y todos sus registros?`)) return;
    const id = del.dataset.borrar;
    db.jugadores = db.jugadores.filter(x=>x.id!==id);
    db.evaluaciones = db.evaluaciones.filter(r=>r.jugadorId!==id);
    db.partidos = db.partidos.filter(r=>r.jugadorId!==id);
    await Store.save(db); view.jugadorId=null; toast('Jugador eliminado'); return render();
  }
  if (t.id==='borrarTodo'){
    if (!confirm('Se borra todo. ¿Seguro?')) return;
    db = { jugadores:[], tomas:[], evaluaciones:[], partidos:[], config:db.config };
    await Store.save(db); toast('Datos borrados'); return render();
  }
  const csv = t.closest('[data-csv]');
  if (csv) return exportarCSV(csv.dataset.csv);
});

const leerNum = id => { const el=document.getElementById(id); if(!el||el.value==='') return null; const n=Number(el.value); return isNaN(n)?null:n; };
const leerEsc = id => { const b=document.querySelector(`[data-scale="${id}"] button[aria-pressed="true"]`); return b?Number(b.dataset.v):null; };
const leerStep = id => { const o=document.querySelector(`[data-step="${id}"] output`); return o?Number(o.textContent):0; };

async function guardarJugador(){
  const apellido = document.getElementById('j-apellido').value.trim();
  if (!apellido) return toast('Falta el apellido');
  const cats = [...document.querySelectorAll('[data-multi="cats"] .chip[aria-pressed="true"]')].map(b=>b.dataset.v);
  if (!cats.length) return toast('Elegí al menos una categoría');
  const datos = { apellido,
    nombre: document.getElementById('j-nombre').value.trim(),
    carnet: document.getElementById('j-carnet').value.trim(),
    fechaNac: document.getElementById('j-nac').value || null,
    categorias: cats,
    posiciones: (()=>{
      const pr = document.getElementById('j-pos').value;
      const otras = [...document.querySelectorAll('[data-multi="pos"] .chip[aria-pressed="true"]')].map(b=>b.dataset.v);
      return [...new Set([pr,...otras])].filter(Boolean);
    })(),
    pierna: document.getElementById('j-pierna').value,
    piernaMala: leerNum('j-piernamala'),
    altura: leerNum('j-altura') };
  const existente = db.jugadores.find(x=>x.id===view.editJugador);
  if (existente){
    Object.assign(existente, datos);
    await Store.save(db);
    toast('Cambios guardados · '+nomb(existente));
    view.editJugador=null; view.jugadorId=existente.id;
  } else {
    db.jugadores.push({ id:uid(), ...datos });
    await Store.save(db); toast('Jugador guardado');
  }
  view.form=null; view.tab='plantel'; marcarTab('plantel'); window.scrollTo(0,0); render();
}

async function guardarToma(){
  const ym = document.getElementById('t-mes').value;
  if (!ym) return toast('Elegí el mes de la toma');
  const previa = db.tomas.find(t=>(t.fecha||'').slice(0,7)===ym);
  if (previa) return toast('Ya existe una toma de ese mes: '+previa.nombre);
  const nueva = { id:uid(), nombre:nombreMes(ym), fecha:ym+'-01' };
  db.tomas.push(nueva);
  await Store.save(db);
  toast('Toma creada · '+nueva.nombre); view.tomaSel=nueva.id; view.form='evaluacion'; render();
}

async function guardarRegistro(tipo){
  const jugadorId = document.getElementById('f-jugador').value;
  if (!jugadorId) return toast('Elegí un jugador');

  if (tipo==='evaluacion'){
    const tomaId = document.getElementById('f-toma').value;
    let reg = db.evaluaciones.find(e=>e.jugadorId===jugadorId && e.tomaId===tomaId);
    const nuevo = !reg;
    if (nuevo) reg = { id:uid(), jugadorId, tomaId, fecha:hoy() };
    let alguno = false;
    FISICO.forEach(t=>{ const v=leerNum('f-'+t.id); if(v!==null){ reg[t.id]=v; alguno=true; } });
    [...TECNICO,...CONDUCTA].forEach(t=>{ const v=leerEsc(t.id); if(v!==null){ reg[t.id]=v; alguno=true; } });
    if (!alguno) return toast('Cargá al menos un dato');
    if (nuevo) db.evaluaciones.push(reg);
    await Store.save(db);
    const j = db.jugadores.find(x=>x.id===jugadorId);
    toast((nuevo?'Evaluación guardada · ':'Evaluación actualizada · ')+nomb(j));
    view.jugadorSel=jugadorId; view.tomaSel=tomaId; formEvaluacion(); window.scrollTo(0,0); return;
  }

}

/* ---------- CSV ---------- */
function exportarCSV(tabla){
  const rows = db[tabla];
  if (!rows.length) return toast('No hay datos en esa tabla');
  const nombreDe = id => { const j=db.jugadores.find(x=>x.id===id); return j?nomb(j):id; };
  const tomaDe = id => { const t=db.tomas.find(x=>x.id===id); return t?t.nombre:id; };
  const cols = [...new Set(rows.flatMap(r=>Object.keys(r)))];
  const extra = tabla==='jugadores' ? [] : ['jugador'];
  const linea = a => a.map(v=>{ const s=(v==null)?'':(Array.isArray(v)?v.join(' / '):String(v));
    return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';');
  const cuerpo = rows.map(r=>linea(cols.map(c=>c==='tomaId'?tomaDe(r[c]):r[c]).concat(extra.length?[nombreDe(r.jugadorId)]:[])));
  const csv = '\uFEFF'+[linea(cols.concat(extra)), ...cuerpo].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = `hsm-${tabla}-${hoy()}.csv`; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV descargado');
}

async function cargarBaseHSM(){
  if (db.jugadores.length && !confirm('Ya hay jugadores cargados. ¿Sumar igual la base del club?')) return;
  const toma = { id:uid(), nombre:'Toma 1 · Abril 2026', fecha:'2026-04-28' };
  db.tomas.push(toma);
  const porKey = {};
  SEED_HSM.jugadores.forEach(j=>{
    const nuevo = { id:uid(), apellido:j.apellido, nombre:j.nombre, carnet:'',
      fechaNac:j.fechaNac, categorias:j.categorias, posiciones:j.posiciones,
      pierna:j.pierna, piernaMala:j.piernaMala, altura:j.altura };
    db.jugadores.push(nuevo); porKey[j.key] = nuevo.id;
  });
  SEED_HSM.evaluaciones.forEach(e=>{
    const id = porKey[e.jugadorKey]; if(!id) return;
    const reg = { id:uid(), jugadorId:id, tomaId:toma.id, fecha:e.fecha };
    ['control','remate','unoOf','unoDef','decision','ubicacion','cooper','yoyo','puntualidad','entrenos']
      .forEach(k=>{ if (e[k]!==undefined) reg[k]=e[k]; });
    db.evaluaciones.push(reg);
  });
  await Store.save(db);
  toast(SEED_HSM.jugadores.length+' jugadores y '+SEED_HSM.evaluaciones.length+' evaluaciones');
  render();
}

/* Datos de la categoría Juveniles (export del club, 15/08/2026).
   Los valores físicos de la toma de abril pasan a la toma de febrero, que es
   cuando se tomaron; donde las dos fuentes discrepan manda el de abril. */
async function cargarJuveniles(){
  if (!db.jugadores.length) return toast('Primero cargá el plantel del club');
  /* se puede volver a correr: actualiza lo que cambió y no duplica lo que ya está */
  const S = SEED_JUVENILES, porKey = {};
  db.jugadores.forEach(j=>{ porKey[keyJugador(j)] = j; });
  const sinMatch = new Set();
  const buscar = k => { const j = porKey[k]; if (!j) sinMatch.add(k); return j; };

  /* 1. categoría Juveniles a los que faltaban */
  S.categorias.forEach(c=>{ const j = buscar(c.key); if (!j) return;
    j.categorias = j.categorias || [];
    if (!j.categorias.includes('Juveniles')) j.categorias.push('Juveniles');
  });

  /* 2. tomas físicas; antes limpiamos el físico de abril para no duplicarlo */
  const refs = {};
  S.tomas.forEach(t=>{
    const previa = db.tomas.find(x=>x.fecha===t.fecha && x.nombre===t.nombre);
    if (previa) { refs[t.ref] = previa; return; }
    const nueva = { id:uid(), nombre:t.nombre, fecha:t.fecha };
    db.tomas.push(nueva); refs[t.ref] = nueva;
  });
  /* el físico de la toma de abril pasa a la de febrero; las tomas nuevas no se tocan */
  const idsNuevas = Object.values(refs).map(t=>t.id);
  S.limpiarFisicoAbril.forEach(k=>{ const j = porKey[k]; if (!j) return;
    db.evaluaciones.filter(e=>e.jugadorId===j.id && !idsNuevas.includes(e.tomaId))
      .forEach(e=>{ delete e.cooper; delete e.yoyo; }); });
  let evs = 0;
  S.evaluaciones.forEach(e=>{ const j = buscar(e.jugadorKey); if (!j) return;
    const t = refs[e.tomaRef];
    const reg = db.evaluaciones.find(x=>x.jugadorId===j.id && x.tomaId===t.id)
      || (db.evaluaciones[db.evaluaciones.push({ id:uid(), jugadorId:j.id, tomaId:t.id, fecha:t.fecha })-1]);
    if (e.cooper!==undefined) reg.cooper = e.cooper;
    if (e.yoyo!==undefined)   reg.yoyo   = e.yoyo;
    evs++;
  });

  /* 3. amistosos 2026, partido a partido */
  let par = 0;
  S.partidos.forEach(m=>{
    if (db.partidos.some(x=>x.fecha===m.fecha && x.rival===m.rival && x.categoria==='Juveniles')) return;
    m.jugadores.forEach(p=>{ const j = buscar(p.k); if (!j) return;
    db.partidos.push({ id:uid(), jugadorId:j.id, fecha:m.fecha, categoria:'Juveniles',
      posicion:'', rival:m.rival, jugo:p.m>0, goles:p.g, asistencias:p.a,
      minutos:p.m, amarillas:p.y, rojas:p.r });
    par++;
  }); });

  /* 4. base de temporadas anteriores (totales anuales) */
  let his = 0;
  Object.keys(S.historial).forEach(k=>{ const j = buscar(k); if (!j) return;
    j.historial = S.historial[k].map(r=>({...r})); his++;
  });

  await Store.save(db);
  if (sinMatch.size) console.warn('Juveniles sin match:', [...sinMatch]);
  toast(par ? `Juveniles: ${par} partidos · ${evs} tests · ${his} historiales`
            : `Juveniles actualizado · ${evs} tests · ${his} historiales`);
  render();
}

/* Planteles por categoría (planilla del club). No toca Juveniles: esa categoría
   ya está cargada partido a partido y sumarle el agregado la duplicaría. */
async function cargarPlanteles(){
  if (!db.jugadores.length) return toast('Primero cargá el plantel del club');
  const S = SEED_PLANTELES;

  /* 1. apellidos que la planilla corrige */
  const antes = {}; db.jugadores.forEach(j=>{ antes[keyJugador(j)] = j; });
  let corr = 0;
  S.correcciones.forEach(c=>{ const j = antes[c.key]; if (!j) return;
    j.apellido = c.apellido; j.nombre = c.nombre; corr++; });

  const idx = {}; db.jugadores.forEach(j=>{ idx[keyJugador(j)] = j; });

  /* 2. altas que faltaban */
  let alta = 0;
  S.nuevos.forEach(n=>{ if (idx[n.key]) return;
    const j = { id:uid(), apellido:n.apellido, nombre:n.nombre, carnet:'', fechaNac:null,
      categorias:[...n.categorias], posiciones:[], pierna:'', piernaMala:null, altura:null };
    db.jugadores.push(j); idx[n.key] = j; alta++; });

  /* 3. categorías: quedan exactamente las de las listas del club */
  let cats = 0;
  Object.keys(S.categorias).forEach(k=>{ const j = idx[k]; if (!j) return;
    const nuevas = [...S.categorias[k]];
    if (JSON.stringify([...(j.categorias||[])].sort())!==JSON.stringify([...nuevas].sort())) cats++;
    j.categorias = nuevas; });

  /* 4. PJ, goles y tarjetas de planilla */
  let base = 0;
  Object.keys(S.base).forEach(k=>{ const j = idx[k]; if (!j) return;
    j.base = S.base[k].map(b=>({...b})); base++; });

  await Store.save(db);
  toast(`Planteles: ${alta} altas · ${cats} categorías · ${base} con datos` + (corr?` · ${corr} apellidos`:''));
  render();
}

let tt;
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2400); }

/* ---------- arranque ---------- */
(async function(){
  const g = await Store.load();
  if (g) db = Object.assign(db, g, {config: Object.assign(db.config, g.config||{})});
  /* datos viejos: posicion + posicionAlt pasan a ser una lista */
  let migrado = false;
  db.jugadores.forEach(j=>{
    if (!j.posiciones){
      j.posiciones = [j.posicion, j.posicionAlt].filter(Boolean);
      delete j.posicion; delete j.posicionAlt; migrado = true;
    }
  });
  if (migrado) await Store.save(db);
  render();
})();
</script>
